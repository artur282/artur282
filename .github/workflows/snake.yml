name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  # Antes se disparaba en CUALQUIER push a main: dos pushes seguidos lanzaban
  # dos ejecuciones que peleaban por la rama `output` y la segunda fallaba con
  # "cannot lock ref 'refs/heads/output'". Ahora solo cuando cambia este fichero
  # (o por cron/dispatch); el grafo se refresca a diario igualmente.
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

# Red de seguridad: si dos ejecuciones coinciden (cron + push), se encolan en
# lugar de colisionar.
concurrency:
  group: snake-output
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: artur282
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
