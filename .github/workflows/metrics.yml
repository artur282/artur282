name: Metrics

# Genera github-metrics.svg dentro del propio repo y lo sirve GitHub desde
# raw.githubusercontent.com — sin servicios de terceros que se caigan.
#
# Tarjeta ANCHA y BAJA a propósito (config_display: columns):
#   ...
# Probar antes de preguntar por un PAT: indepth clona repos PÚBLICOS.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: metrics-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: artur282
          template: classic
          config_timezone: America/Caracas
          config_display: columns
          config_padding: 0, 8 + 11%
          base: header, activity
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 120
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css, scss, dockerfile, shell, makefile, batchfile, procfile