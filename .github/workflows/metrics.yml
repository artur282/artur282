name: Metrics

# Genera github-metrics.svg dentro del propio repo y lo sirve GitHub desde
# raw.githubusercontent.com — sin servicios de terceros que se caigan.
#
# Token: usa el PAT `METRICS_TOKEN` si existe; si no, cae al GITHUB_TOKEN
# del workflow (funciona para datos públicos). Para desbloquear todos los
# plugins (traffic, habits, stars) añade el PAT:
#   gh secret set METRICS_TOKEN --repo artur282/artur282
#
# Formato: tarjeta ANCHA y BAJA a propósito. Sin isocalendar, sin lines y
# sin followup: esas tres secciones triplicaban la altura, y como el README
# la estiraba al 100% del ancho, acababa ocupando media pantalla.

on:
  schedule:
    # 03:00 UTC = 23:00 en Venezuela
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml
      - README.md

# Serializa las ejecuciones: dos runs solapados commiteando github-metrics.svg
# chocaban con "cannot lock ref". Con esto se encolan en vez de fallar.
concurrency:
  group: metrics-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: artur282
          template: classic
          config_timezone: America/Caracas

          # Columnas = tarjeta más ancha y menos alta. El padding por
          # defecto (11%) se mantiene; solo se recorta el aire vertical.
          config_display: columns
          config_padding: 0, 8 + 11%

          # Fuera "repositories": sus repos tienen pocas estrellas y el
          # bloque ocupaba media tarjeta. La actividad y los lenguajes sí
          # dicen algo.
          base: header, activity, community, metadata

          # Lenguajes: solo el porcentaje, sin bytes (dos columnas de
          # texto hacen el bloque más alto).
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 5
          plugin_languages_ignored: html, css, scss, dockerfile, shell, makefile, batchfile, jupyter notebook
