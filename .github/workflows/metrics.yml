name: Metrics

# Genera github-metrics.svg dentro del propio repo y lo sirve GitHub desde
# raw.githubusercontent.com — sin servicios de terceros que se caigan.
#
# Token: usa el PAT `METRICS_TOKEN` si existe; si no, cae al GITHUB_TOKEN
# del workflow (funciona para datos públicos). Para desbloquear todos los
# plugins (traffic, habits, stars) añade el PAT:
#   gh secret set METRICS_TOKEN --repo artur282/artur282

on:
  schedule:
    # 03:00 UTC = 23:00 en Venezuela
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml
      - README.md

# Serializa las ejecuciones: dos runs solapados commiteando github-metrics.svg
# chocaban con "cannot lock ref". Con esto se encolan en vez de fallar.
concurrency:
  group: metrics-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: artur282
          template: classic
          config_timezone: America/Caracas

          # Base: cabecera, actividad, comunidad, repositorios y metadata
          base: header, activity, community, repositories, metadata

          # Calendario de contribuciones (mitad de año)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Lenguajes por bytes y porcentaje
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          plugin_languages_sections: most-used

          # Líneas de código en el tiempo
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_history_limit: 1

          # Issues y PRs abiertos frente a cerrados
          plugin_followup: yes
          plugin_followup_sections: repositories
